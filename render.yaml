# One-click deploy on Render (Blueprint). Set ANTHROPIC_API_KEY and KEYSTONE_API_TOKEN as secrets in the dashboard.
# Render containers cannot create Linux namespaces, so the agent code sandbox (bubblewrap) refuses to run there and
# /healthz reports degraded:[sandbox]; everything else works. For sandboxed agent analysis, run the same image on a
# host that allows namespaces (a VM, Fly Machines) with --security-opt seccomp=unconfined (CI proves both cases).
services:
  - type: web
    name: keystone
    runtime: docker
    plan: standard
    healthCheckPath: /healthz
    envVars:
      - key: KEYSTONE_REGION
        value: orange_county_ca
      - key: KEYSTONE_PROXY_HOPS  # Render's edge proxy adds the real client address to X-Forwarded-For
        value: "1"
      - key: KEYSTONE_STATE_DIR  # runs, skills library, agent lessons: they must survive deploys for self-improvement
        value: /app/state
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KEYSTONE_API_TOKEN
        generateValue: true
    disk:
      name: keystone-state
      mountPath: /app/state
      sizeGB: 5
