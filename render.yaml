# One-click deploy on Render (Blueprint). Set ANTHROPIC_API_KEY and KEYSTONE_API_TOKEN as secrets in the dashboard.
services:
  - type: web
    name: keystone
    runtime: docker
    plan: standard
    healthCheckPath: /healthz
    envVars:
      - key: KEYSTONE_REGION
        value: orange_county_ca
      - key: KEYSTONE_STATE_DIR  # runs, skills library, agent lessons: they must survive deploys for self-improvement
        value: /app/state
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KEYSTONE_API_TOKEN
        generateValue: true
    disk:
      name: keystone-state
      mountPath: /app/state
      sizeGB: 5
