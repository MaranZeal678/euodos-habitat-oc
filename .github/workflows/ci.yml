# Proves on Linux what a Mac cannot: the bubblewrap sandbox, and the Docker image that Render deploys.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.26"
      - name: Install
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python --torch-backend cpu -r requirements-dev.txt
          .venv/bin/playwright install --with-deps chromium
      - name: Linux sandbox prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces by default; bubblewrap needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Sandbox diagnostics (interpreter layout bubblewrap must expose)
        run: |
          .venv/bin/python -c "import sys, os; print('exe', sys.executable, '->', os.path.realpath(sys.executable)); print('prefix', sys.prefix, 'base', sys.base_prefix)"
          ldd "$(readlink -f .venv/bin/python)" || true
          ls -la / | grep -E ' (bin|lib|lib64|sbin) ' || true
          .venv/bin/python -c "from keystone.sandbox import runner; r = runner.run_python('import sys; print(sys.version)'); print(r)"
      - name: Lint
        run: .venv/bin/ruff check keystone tests scripts
      - name: Types
        run: .venv/bin/pyright keystone
      - name: Dead code
        run: .venv/bin/vulture keystone --min-confidence 80
      - name: Tests (unit, fuzz, hardening, deploy, browser) with coverage gate
        env:
          KEYSTONE_REQUIRE_OS_SANDBOX: "1"
        run: .venv/bin/python -m pytest -q tests --cov=keystone --cov-report=term-missing:skip-covered --cov-fail-under=75

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the image Render deploys
        run: docker build -t keystone .
      - name: Run it like production (token set, no extra privileges)
        run: |
          docker run -d --name ks -p 8000:8000 -e KEYSTONE_API_TOKEN=ci-token keystone
          for i in $(seq 1 60); do curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:8000/healthz | tee healthz.json
      - name: Product endpoints answer from a fresh image
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/summary)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/optimize -H 'content-type: application/json' -d '{"income": 92000}')" = 200
          curl -fsS localhost:8000/api/demo/trace | python3 -c "import json,sys; t=json.load(sys.stdin); assert t['grade']['score'] == 1.0"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp/ -d '{}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/mission -H 'Authorization: Bearer ci-token' -H 'content-type: application/json' -d '{"policy": "scripted"}')" = 200
      - name: Unprivileged container (Render-like) - the sandbox fails closed and says so
        run: |
          # Docker's default seccomp/proc masking forbids new namespaces, so bubblewrap cannot start. Keystone must refuse
          # to run agent code (never run it unsandboxed) and report it on /healthz.
          python3 -c "import json; h=json.load(open('healthz.json')); s=h['sandbox']; print(s); assert h['degraded'] == ['sandbox'] and not s['ok'] and s['kind'] == 'bubblewrap'"
      - name: Host that allows namespaces (VM, Fly Machines) - the sandbox works in the same image
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run -d --name ks2 -p 8001:8000 -e KEYSTONE_API_TOKEN=ci-token --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined --security-opt systempaths=unconfined keystone
          for i in $(seq 1 60); do curl -fsS localhost:8001/healthz >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:8001/healthz | tee healthz2.json
          python3 -c "import json; s=json.load(open('healthz2.json'))['sandbox']; assert s['ok'], s"
      - name: Server log on failure
        if: failure()
        run: docker logs ks; docker logs ks2 || true
