<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Euodos · Crossline scenario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #061012; --bg-2: #0b1a1d; --line: #1d3b36; --grid: #12302b;
  --ink: #e9f5f2; --ink-2: #b4c9c3; --ink-3: #8aa7a0;
  --teal: #2ee6be; --teal-dim: #15705e; --amber: #f5b04c; --red: #ff7a69; --grey: #4b5d59;
  --display: "Sora", "Avenir Next", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }  /* author display rules must never override the hidden attribute */
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
body.big { font-size: 21px; }
button, input, select { font: inherit; }
:where(a, button, input, select, [tabindex]):focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
.btn { background: rgba(46, 230, 190, .12); border: 1px solid var(--teal); color: var(--ink); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.btn:hover { background: rgba(46, 230, 190, .22); }
.btn.quiet { border-color: var(--line); background: transparent; color: var(--ink-2); }
.mono { font-family: var(--mono); }
/* sign-in */
#login { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 30% 20%, #0f2a28, var(--bg) 60%); z-index: 5; }
#login form { width: min(420px, 100%); display: grid; gap: 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
#login h1 { margin: 0; font: 800 30px/1.1 var(--display); letter-spacing: .28em; }
#login p { margin: 0; color: var(--ink-2); }
#login label { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
#login input { background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 10px 12px; }
#loginErr { color: var(--red); min-height: 1.5em; }
.hint { font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 12px; }
/* stage */
#stage { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
header { display: flex; align-items: center; gap: 18px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font: 800 18px/1 var(--display); letter-spacing: .32em; }
.brand small { display: block; font: 400 11px/1.6 var(--mono); letter-spacing: .06em; color: var(--ink-2); margin-top: 4px; }
#beats { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
#beats button { background: transparent; border: 1px solid var(--line); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
#beats button.on { border-color: var(--teal); color: var(--ink); background: rgba(46, 230, 190, .12); }
#user { font-size: 13px; color: var(--ink-2); display: flex; gap: 10px; align-items: center; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
#vizWrap { position: relative; min-height: 0; }
#viz { width: 100%; height: 100%; display: block; }
#agentTree { position: absolute; inset: 4% 6%; background: rgba(6,16,18,.95); border: 1px solid var(--teal-dim); border-radius: 18px; padding: 18px 24px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
#agentTree .tq { font: 600 22px/1.3 var(--display); color: var(--ink); }
#agentTree .tq small { display: block; font: 500 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--teal); margin-bottom: 4px; }
#agentTree svg { width: 100%; height: 100%; }
#agentTree .tf { display: flex; justify-content: space-between; gap: 12px; align-items: center; font: 14px var(--mono); color: var(--ink-3); }
.ask { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 10px; font: 14px/1.4 var(--body); }
#panel { border-left: 1px solid var(--line); padding: 18px; overflow: auto; display: grid; gap: 14px; align-content: start; }
#panel h3 { margin: 0; font: 600 13px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
#panel label { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
#panel input[type=number], #panel select { background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 10px; }
.lever { display: flex !important; grid-template-columns: none; gap: 10px; align-items: center; color: var(--ink) !important; }
.lever small { color: var(--ink-3); display: block; }
#status { min-height: 1.5em; font-size: 14px; color: var(--ink-2); }
footer { display: flex; gap: 20px; align-items: flex-end; padding: 18px 24px 22px; border-top: 1px solid var(--line); flex-wrap: wrap; }
#headline { font: 800 clamp(40px, 6vw, 84px)/1 var(--display); letter-spacing: -.02em; color: var(--teal); display: flex; align-items: center; gap: 12px; }
#headline button { font: 600 14px var(--mono); border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); padding: 4px 10px; cursor: pointer; }
#label { font: 600 clamp(17px, 1.6vw, 24px)/1.3 var(--display); max-width: 46ch; }
#why { margin-left: auto; max-width: 52ch; font-size: 15px; color: var(--ink-2); border-left: 2px solid var(--teal); padding-left: 12px; }
#why b { color: var(--ink); }
#toasts { position: fixed; right: 360px; top: 76px; display: grid; gap: 6px; z-index: 3; pointer-events: none; }
.toast { font: 13px/1.4 var(--mono); background: rgba(11, 26, 29, .92); border: 1px solid var(--line); border-left: 3px solid var(--teal); padding: 6px 10px; border-radius: 6px; color: var(--ink); }
.toast i { color: var(--ink-3); font-style: normal; }
dialog { background: var(--bg-2); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; max-width: min(640px, 92vw); padding: 22px; }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
dialog pre { white-space: pre-wrap; font: 13px/1.5 var(--mono); color: var(--ink-2); background: var(--bg); padding: 10px; border-radius: 8px; }
.svgt { font-family: var(--body); }
/* film mode: a 1920x1080 frame with nothing interactive on it */
body.film header #beats, body.film header #user, body.film #panel, body.film #why button, body.film #headline button { display: none; }
body.film main { grid-template-columns: 1fr; }
body.film #toasts { right: 40px; top: 96px; }
body.film footer { padding: 26px 48px 34px; }
body.film #label { font-size: 40px; max-width: 46ch; }
body.film #why { font-size: 24px; border-left-width: 3px; }
body.film .toast { font-size: 18px; padding: 8px 14px; }
#user { flex-wrap: wrap; }
@media (max-width: 900px) {
  /* phones and narrow windows: the page scrolls instead of squeezing the visual into the leftover height */
  html, body { height: auto; }
  #stage { height: auto; min-height: 100vh; grid-template-rows: auto auto auto; }
  main { grid-template-columns: 1fr; }
  #viz { height: auto; aspect-ratio: 1600 / 760; }
  #panel { border-left: 0; border-top: 1px solid var(--line); }
  header { padding: 12px 16px; } #beats { margin-left: 0; }
  footer { padding: 16px; } #headline { font-size: 44px; } #label { font-size: 18px; }
  #toasts { right: 16px; top: auto; bottom: 16px; } #why { margin-left: 0; }
}
#summary { position: fixed; inset: 0; z-index: 6; background: #fff; color: #111; overflow: auto; padding: 40px 56px; font: 15px/1.5 var(--body); }
#summary .wordmark { font: 800 40px/1 var(--display); letter-spacing: .32em; color: #0f6b5c; margin-bottom: 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
#summary .wordmark span { font: 600 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #555; }
#summary h1 { font: 800 30px/1.15 var(--display); margin: 0 0 4px; }
#summary h2 { font: 700 15px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #15705e; margin: 22px 0 6px; }
#summary .big { font: 800 34px/1 var(--display); color: #0f6b5c; }
#summary .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
#summary .src { font-size: 12px; color: #555; }
#summary .bar { display: flex; gap: 10px; margin-bottom: 18px; }
.checks { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 8px; font-size: 14px; }
.checks small { display: block; color: var(--ink-3); margin-left: 18px; }
#dataList small { margin-left: 0; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: grid; gap: 6px; }
.card p { margin: 0; color: var(--ink-2); }
.card .metric b { color: var(--teal); }
.card .gate { color: var(--ink-3); font-size: 13px; }
#summary #printBtn { background: #0f6b5c; color: #fff; border-color: #0f6b5c; }
@media (max-width: 700px) { #summary { padding: 24px 16px; } #summary .grid { grid-template-columns: 1fr; } #summary h1 { font-size: 24px; } }
@media print { header, #panel, #toasts, footer, #stage, #summary .bar { display: none !important; } #summary { position: static; padding: 0; } body { background: #fff; color: #000; } }
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>EUODOS</h1>
    <p>Sign in to run the Crossline Church scenario.</p>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <div id="loginErr" role="alert"></div>
    <button class="btn" type="submit">Sign in</button>
    <div class="hint" id="demoHint" hidden></div>
  </form>
</div>

<div id="stage" hidden>
  <header>
    <div class="brand">EUODOS<small id="title">Crossline Church offers its parking lot</small></div>
    <nav id="beats" aria-label="Scenario steps"></nav>
    <div id="user"><span id="who"></span><button class="btn quiet" id="bigBtn" title="Large type (L)">Aa</button><button class="btn quiet" id="resetBtn" title="Reset the scenario (R)">Reset</button><button class="btn quiet" id="summaryBtn" title="One-page summary (P)">Summary</button><button class="btn quiet" id="signOut">Sign out</button></div>
  </header>
  <main>
    <div id="vizWrap"><svg id="viz" viewBox="0 0 1600 760" role="img" aria-label="Scenario visual"></svg><div id="agentTree" hidden aria-live="polite"></div></div>
    <aside id="panel" aria-label="Controls"></aside>
  </main>
  <footer>
    <div>
      <div id="headline" aria-live="polite"><span id="hv"></span><button id="explainBtn" title="Where does this number come from?">ⓘ source</button></div>
      <div id="label"></div>
    </div>
    <div id="why"></div>
  </footer>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="summary" hidden></div>
<dialog id="explain"><h3 id="exTitle" style="margin-top:0;font-family:var(--display)"></h3><div id="exBody"></div><p><button class="btn" id="exClose">Close</button></p></dialog>

<script>
const $ = s => document.querySelector(s);
const FILM = new URLSearchParams(location.search).has("film");
const NS = "http://www.w3.org/2000/svg";
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (p, a, b) => ease(clamp((p - a) / (b - a)));   // eased progress of p inside [a, b]
const usd = v => v >= 1e6 ? `$${(v / 1e6).toFixed(1)}M` : `$${Math.round(v / 1e3)}k`;
let S = null, TRACE = null, beat = 0;

function svg(tag, attrs = {}, parent = $("#viz")) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (parent) parent.appendChild(el);
  return el;
}
function text(x, y, str, attrs = {}, parent) {
  const t = svg("text", {x, y, fill: "#e9f5f2", "font-size": 22, class: "svgt", ...attrs}, parent);
  t.textContent = str;
  return t;
}

// ---------------------------------------------------------------- the six beats: build() once, update(p) per frame
const BEATS = [
  {id: "site", name: "1 · The offer", head: "site",
   why: "<b>Find it, in minutes.</b> A CNN read this lot from real aerial imagery; SB 4 makes faith land buildable by right."},
  {id: "path", name: "2 · The path", head: "path",
   why: "<b>Pick the path.</b> Seven legal paths, each with its own statute, clock and tests. A missing fact is \"to verify\", never assumed; the clock follows the path you pick."},
  {id: "clock", name: "3 · The clock", head: "clock",
   why: "<b>Clear it.</b> SB 4 skips discretionary approval and CEQA; the funding package and family pre-qualification start on day one, not after approval."},
  {id: "families", name: "4 · Families", head: "mortgages",
   why: "<b>Families banks turn away.</b> Each mortgage is priced on whether the family keeps the home for 10 years, not on debt-to-income at closing."},
  {id: "funding", name: "5 · Who pays", head: "capital",
   why: "<b>Fund it.</b> Notes valued at present value, every home underwritten on its own family's design; only real shortfalls need philanthropy."},
  {id: "decade", name: "6 · Ten years", head: "decade",
   why: "<b>They stay.</b> The same shocks hit every household under three ways of financing; the Steward reaches out before a missed payment."},
];

const V = {};  // per-beat element handles

function buildSite() {
  const s = S.site, q = s.quad;
  const lon0 = Math.min(...q.map(p => p[0])), lon1 = Math.max(...q.map(p => p[0]));
  const lat0 = Math.min(...q.map(p => p[1])), lat1 = Math.max(...q.map(p => p[1]));
  const H = 700, W = Math.round(H * 740 / 879), X = 70, Y = 30;
  const P = ([lon, lat]) => [X + (lon - lon0) / (lon1 - lon0) * W, Y + (lat1 - lat) / (lat1 - lat0) * H];
  svg("rect", {x: X - 2, y: Y - 2, width: W + 4, height: H + 4, rx: 10, fill: "none", stroke: "#1d3b36"});
  svg("image", {href: s.img_rgb, x: X, y: Y, width: W, height: H, preserveAspectRatio: "none"});
  const defs = svg("defs");
  const clip = svg("clipPath", {id: "scanClip"}, defs);
  V.scanRect = svg("rect", {x: X, y: Y, width: 0, height: H}, clip);
  svg("image", {href: s.img_mask, x: X, y: Y, width: W, height: H, preserveAspectRatio: "none", "clip-path": "url(#scanClip)", opacity: .85});
  V.scanLine = svg("line", {x1: X, x2: X, y1: Y, y2: Y + H, stroke: "#2ee6be", "stroke-width": 3, opacity: 0});
  V.homes = s.homes_polygons.map(poly => {
    const pts = poly.map(P), cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    const g = svg("g", {opacity: 0});
    svg("polygon", {points: pts.map(p => p.join(",")).join(" "), fill: "#2ee6be", stroke: "#061012", "stroke-width": 1}, g);
    return {g, cx, cy};
  });
  const R = X + W + 70;
  text(R, 70, `${s.name}, ${s.city}`, {"font-size": 34, "font-family": "Sora", "font-weight": 700});
  text(R, 104, `${s.parcel_acres} acres · APN ${s.apn} · stored CNN scan (model ${s.model_version})`, {"font-size": 17, fill: "#b4c9c3"});
  V.parking = text(R, 190, "", {"font-size": 64, "font-family": "Sora", "font-weight": 800, fill: "#2ee6be"});
  text(R, 222, "m² of surface parking found by the CNN", {"font-size": 19, fill: "#b4c9c3"});
  text(R, 300, "SB 4 screen", {"font-size": 16, fill: "#b4c9c3", "font-family": "JetBrains Mono", "letter-spacing": 2});
  V.checks = s.sb4.map((c, i) => {
    const g = svg("g", {opacity: 0, transform: `translate(${R},${336 + i * 62})`});
    const ok = c.status === "met";
    svg("circle", {cx: 12, cy: -6, r: 11, fill: ok ? "#2ee6be" : "none", stroke: ok ? "#2ee6be" : "#f5b04c", "stroke-width": 2}, g);
    text(6, 0, ok ? "✓" : "?", {"font-size": 15, fill: ok ? "#061012" : "#f5b04c", "font-weight": 700}, g);
    text(36, 0, c.check, {"font-size": 19}, g);
    text(36, 24, `${c.status} · ${c.note}`, {"font-size": 15, fill: ok ? "#8aa7a0" : "#f5b04c"}, g);
    return g;
  });
  V.siteW = W; V.siteX = X;
}
function updateSite(p) {
  const scan = seg(p, .05, .45);
  V.scanRect.setAttribute("width", scan * V.siteW);
  V.scanLine.setAttribute("x1", V.siteX + scan * V.siteW); V.scanLine.setAttribute("x2", V.siteX + scan * V.siteW);
  V.scanLine.setAttribute("opacity", scan > 0 && scan < 1 ? 1 : 0);
  V.parking.textContent = Math.round(S.site.parking_sqm * scan).toLocaleString("en-US");
  V.homes.forEach((h, i) => {
    const r = seg(p, .45 + i * .012, .55 + i * .012);
    h.g.setAttribute("opacity", r);
    h.g.setAttribute("transform", `translate(${h.cx},${h.cy}) scale(${.4 + .6 * r}) translate(${-h.cx},${-h.cy})`);
  });
  V.checks.forEach((g, i) => g.setAttribute("opacity", seg(p, .55 + i * .07, .65 + i * .07)));
}

const VERDICT = {fits: ["✓", "#2ee6be", "fits"], verify: ["?", "#f5b04c", "fits if verified"], no: ["✕", "#ff7a69", "ruled out"]};
function buildPath() {
  const R = S.path.results, pr = R.project, x0 = 660, x1 = 1150, maxD = 730, y0 = 132, rh = 86;
  const zone = {unknown: "zoning unknown", single_family: "single-family zone", multifamily: "multifamily zone", nonresidential: "non-residential zone"}[pr.zoning];
  text(70, 52, `Seven legal paths for APN ${S.site.apn}`, {"font-size": 30, "font-family": "Sora", "font-weight": 700});
  text(70, 84, `${pr.homes} for-sale homes · ${zone} · statutes checked ${R.checked} (current numbering)`, {"font-size": 17, fill: "#b4c9c3"});
  [0, 90, 365, 730].forEach(d => {
    const x = x0 + d / maxD * (x1 - x0);
    svg("line", {x1: x, x2: x, y1: 104, y2: y0 + R.paths.length * rh - 20, stroke: "#12302b"});
    text(x, 100, d === 0 ? "0" : d === 730 ? "2 years" : d === 365 ? "1 year" : "90 days", {"font-size": 14, fill: "#8aa7a0", "text-anchor": "middle", "font-family": "JetBrains Mono"});
  });
  V.paths = R.paths.map((r, i) => {
    const y = y0 + i * rh, [mk, col, word] = VERDICT[r.verdict], chosen = r.key === S.path.choice;
    const g = svg("g", {opacity: 0});
    if (chosen) svg("rect", {x: 50, y: y - 8, width: 1510, height: rh - 10, rx: 12, fill: "rgba(46,230,190,.08)", stroke: "#2ee6be", "stroke-width": 2}, g);
    svg("circle", {cx: 90, cy: y + 28, r: 17, fill: r.verdict === "fits" ? col : "none", stroke: col, "stroke-width": 2.5}, g);
    text(90, y + 35, mk, {"font-size": 19, fill: r.verdict === "fits" ? "#061012" : col, "font-weight": 800, "text-anchor": "middle"}, g);
    text(125, y + 26, r.name, {"font-size": 23, "font-family": "Sora", "font-weight": 700, fill: r.verdict === "no" ? "#8aa7a0" : "#e9f5f2"}, g);
    text(125, y + 52, `${r.statute}${r.formerly ? ` (formerly ${r.formerly})` : ""} · ${r.review}`, {"font-size": 15, fill: "#8aa7a0", "font-family": "JetBrains Mono"}, g);
    const bar = svg("rect", {x: x0, y: y + 12, height: 28, rx: 7, width: 0, fill: r.verdict === "no" ? "#33403d" : (r.review === "ministerial" ? "#2ee6be" : "#8aa7a0")}, g);
    const w = r.days ? Math.max(6, r.days / maxD * (x1 - x0)) : 0;
    const inside = r.days > 400;  // long bars carry their label inside, clear of the verdict column
    text(!r.days ? x0 : inside ? x0 + w - 12 : x0 + w + 12, y + 33, r.days ? `${r.days} days` : "clock unknown: read the statute",
         {"font-size": 16, fill: !r.days ? "#f5b04c" : inside ? "#061012" : "#b4c9c3", "font-family": "JetBrains Mono", "text-anchor": inside ? "end" : "start", "font-weight": inside ? 700 : 400}, g);
    const why = r.verdict === "no" ? r.failing[0] : r.verdict === "verify" ? `${r.to_verify} to verify` : "every test met";
    text(1190, y + 26, chosen ? "chosen path" : word, {"font-size": 17, fill: chosen ? "#2ee6be" : col, "font-weight": 700}, g);
    text(1190, y + 50, why.length > 44 ? why.slice(0, 43) + "…" : why, {"font-size": 15, fill: "#8aa7a0"}, g);
    if (!FILM && r.verdict !== "no" && !chosen) {
      g.style.cursor = "pointer"; g.setAttribute("tabindex", 0); g.setAttribute("role", "button"); g.setAttribute("aria-label", `Use ${r.name}`);
      const pick = () => change("/api/scenario/path", {choice: r.key});
      g.addEventListener("click", pick); g.addEventListener("keydown", e => { if (e.key === "Enter") pick(); });
    }
    return {g, bar, w};
  });
}
function updatePath(p) {
  V.paths.forEach((r, i) => {
    r.g.setAttribute("opacity", seg(p, .04 + i * .07, .16 + i * .07));
    r.bar.setAttribute("width", r.w * seg(p, .2 + i * .07, .5 + i * .07));
  });
}

function buildClock() {
  const T = S.timeline, rows = T.baseline.phases.map(b => ({b, k: T.keystone.phases.find(x => x.key === b.key)}));
  const x0 = 380, x1 = 1520, max = 52, y0 = 120, rh = 68, X = m => x0 + m / max * (x1 - x0);
  for (let y = 0; y <= 4; y++) {
    svg("line", {x1: X(y * 12), x2: X(y * 12), y1: 80, y2: y0 + rows.length * rh, stroke: "#12302b"});
    text(X(y * 12), 70, `year ${y}`, {"font-size": 16, fill: "#8aa7a0", "text-anchor": "middle", "font-family": "JetBrains Mono"});
  }
  V.rows = rows.map((r, i) => {
    const y = y0 + i * rh;
    const name = text(x0 - 20, y + 34, r.b.name, {"font-size": 19, "text-anchor": "end"});
    const bar = svg("rect", {y: y + 12, height: 34, rx: 8, fill: "#4b5d59"});
    const chip = text(0, y + 35, "", {"font-size": 15, fill: "#061012", "font-weight": 700, "font-family": "JetBrains Mono"});
    return {...r, bar, chip, name};
  });
  V.endLine = svg("line", {y1: 90, y2: y0 + rows.length * rh + 6, stroke: "#2ee6be", "stroke-width": 3, "stroke-dasharray": "6 6"});
  const ty = y0 + rows.length * rh + 24;  // the whole project as one bar: offer to move-in
  text(x0 - 20, ty + 33, "Offer to move-in", {"font-size": 22, "text-anchor": "end", "font-family": "Sora", "font-weight": 800});
  V.total = svg("rect", {x: X(0), y: ty, height: 48, rx: 10, fill: "#ff7a69"});
  V.endLabel = text(0, ty + 34, "", {"font-size": 26, "font-family": "Sora", "font-weight": 800, fill: "#e9f5f2"});
  V.clockX = X;
  V.LEVER = {instant_screen: "CNN: minutes", sb4_ministerial: `${S.headlines.path.value}: by right`, parallel_funding: "day one"};
}
function updateClock(p) {
  const e = seg(p, .18, .62), X = V.clockX;
  V.rows.forEach(r => {
    const s = lerp(r.b.start, r.k.start, e), m = lerp(r.b.months, r.k.months, e);
    const crit = e > .5 ? r.k.critical : r.b.critical;
    r.bar.setAttribute("x", X(s)); r.bar.setAttribute("width", Math.max(4, X(s + m) - X(s)));
    r.bar.setAttribute("fill", e > .5 ? (crit ? "#2ee6be" : "#15705e") : (crit ? "#8aa7a0" : "#4b5d59"));
    const lever = r.k.lever && V.LEVER[r.k.lever];
    r.chip.textContent = lever && e > .7 ? lever : "";
    r.chip.setAttribute("x", X(s) + 10);
    r.name.textContent = e > .5 ? r.k.name : r.b.name;
  });
  const end = lerp(S.timeline.baseline.months, S.timeline.keystone.months, e);
  V.endLine.setAttribute("x1", X(end)); V.endLine.setAttribute("x2", X(end));
  V.total.setAttribute("width", X(end) - X(0));
  const red = [255, 122, 105], teal = [46, 230, 190];
  V.total.setAttribute("fill", `rgb(${red.map((c, i) => Math.round(lerp(c, teal[i], e))).join(",")})`);
  V.endLabel.setAttribute("x", X(end) + 16);
  V.endLabel.textContent = `${(end / 12).toFixed(1)} years ${e < .5 ? "(before)" : e < 1 ? "" : "(with Euodos)"}`;
}

function updateFamilies(p) {
  const a = seg(p, .05, .35), b = seg(p, .45, .85);
  const denied = S.households.filter(h => h.p_denied > .5).length;
  V.denied.textContent = `${Math.round(denied * a)} of ${S.households.length}`;
  const exp = S.households.reduce((t, h) => t + h.p.keystone, 0), mk = S.households.reduce((t, h) => t + h.p.market, 0);
  V.keep.textContent = b > 0 ? `${(exp * b).toFixed(1)} of ${S.households.length}` : "";
  V.market.textContent = b > .6 ? `vs ${mk.toFixed(1)} on market-rate loans` : "";
  const designs = {};
  S.households.forEach(h => designs[h.design] = (designs[h.design] || 0) + 1);
  const top = Object.entries(designs).sort((x, y) => y[1] - x[1])[0];
  V.design.textContent = b > .8 && top ? `most common design: ${top[0]} (${top[1]} homes)` : "";

const STATE_FILL = ["#2ee6be", "#f5b04c", "#ff9d5c", "#ff7a69", "#33403d"];

  text(80, 720, "Animation: one simulated decade per household (same shocks for all three). Headline counts are expected values over 1,500 decades.", {"font-size": 15, fill: "#8aa7a0"});
}
function updateDecade(p) {
  const m = Math.min(119, Math.floor(seg(p, .02, .9) * 120));
  V.month.textContent = `month ${m + 1} of 120`;
  V.dec.forEach(row => {
    let own = 0;
    row.cells.forEach(({h, glyph, ring}) => {
      const st = +h.decade[row.k].states[m];
      own += st !== 4;
      glyph.setAttribute("fill", STATE_FILL[st]);
      ring.setAttribute("opacity", h.decade[row.k].steward.some(s => s <= m && s > m - 3) ? 1 : 0);
    });
    row.count.textContent = `${own} / ${row.cells.length}`;
  });
}

async function api(path, body, method = "POST") {
  const res = await fetch(path, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { signedOut(); throw new Error("signed out"); }
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : (data.detail?.[0]?.msg || `error ${res.status}`));
  return data;
}
async function change(path, body) {

}

      <label>AHP per home ($, assumption)<input type="number" id="ah" min="0" step="1000" value="${S.capital.assumptions.ahp_per_home}"></label>
      <button class="btn" id="capGo">Recompute</button><div id="status" role="status"></div>`;
    $("#capGo").onclick = () => change("/api/scenario/assumptions", {hard_cost_per_sqft: +$("#hc").value, calhome: +$("#ch").value, ahp: +$("#ah").value});
  }
  if (id === "decade") P.innerHTML = `<h3>Ten years</h3><p>Colours: <span style="color:#2ee6be">current</span>, <span style="color:#f5b04c">cash under one payment</span>, <span style="color:#ff9d5c">missed a payment</span>, <span style="color:#ff7a69">90+ days late</span>, grey = home lost; blue ring = the Steward reaches out.</p><button class="btn" id="replay">Replay the decade</button>`;
  if (id === "decade") $("#replay").onclick = () => showBeat(beat);
}

async function cnnCard() {  // the champion parking model and its gate history, from the live model registry
  const reg = await (await fetch("/api/registry")).json().catch(() => null), el = $("#cnnCard");
  const hist = reg && reg.parking_cnn;
  if (!el) return;
  if (!hist) { el.textContent = "Model registry unavailable."; return; }
  const champ = hist.find(m => m.status === "champion"), rejected = hist.filter(m => m.status === "rejected");
  const m = champ.metrics, pr = champ.params;
  el.innerHTML = `<p><b>U-Net</b> on 5 channels: RGB, near-infrared and NDVI (vegetation)</p>
    <p>Trained on <b>${pr.n_train}</b> image chips, tested on <b>${pr.n_holdout}</b> held out · labels are OpenStreetMap parking polygons (noisy, free)</p>
    <p class="metric"><b>IoU ${m.iou.toFixed(3)}</b> · pixel accuracy ${(m.pixel_acc * 100).toFixed(1)}% · champion ${esc(champ.version)}</p>
    ${rejected.length ? `<p class="gate"><b>${rejected.length} challenger${rejected.length > 1 ? "s" : ""} rejected by the promotion gate:</b> ${esc(rejected[rejected.length - 1].decision_reasons.at(-1))}</p>` : ""}`;
}

function toast(html, ms = 4200) {
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html;
  $("#toasts").prepend(t);
  while ($("#toasts").children.length > 6) $("#toasts").lastChild.remove();
  setTimeout(() => t.remove(), ms);
}
function askBox() {
  return `<h3>Ask the agents</h3><textarea id="askQ" class="ask" maxlength="400" placeholder="Evaluate SB 4 and SB 35 compliance for this parcel."></textarea>
    <button class="btn" id="runAgents">Run the agents on this offer</button>`;
}
const TREE = [  // the agent hierarchy (keystone/agents/specs.py), laid out for the live overlay
  {k: "director", n: "Director", m: "Opus 5.5", x: 500, y: 60},
  {k: "land_lead", n: "Land lead", m: "Opus 5.5", x: 140, y: 205, p: "director"},
  {k: "family_lead", n: "Family lead", m: "Opus 5.5", x: 380, y: 205, p: "director"},
  {k: "capital_lead", n: "Capital lead", m: "Opus 5.5", x: 620, y: 205, p: "director"},
  {k: "steward", n: "Steward", m: "Sonnet 5.5", x: 860, y: 205, p: "director"},
  {k: "site_analyst", n: "Site analysts", m: "Sonnet 5.5", x: 140, y: 350, p: "land_lead"},
  {k: "underwriter", n: "Underwriters", m: "Sonnet 5.5", x: 380, y: 350, p: "family_lead"},
];
function showTree(question, policy) {
  const T = $("#agentTree");
  T.innerHTML = `<div class="tq"><small>Claude agents · live</small>“${esc(question)}”</div><svg id="treeSvg" viewBox="0 0 1000 420"></svg>
    <div class="tf"><span id="treeFoot">${policy === "scripted" ? POLICY_NOTE.scripted : "starting…"}</span><button class="btn quiet" id="treeClose">Close</button></div>`;
  T.hidden = false;
  $("#treeClose").onclick = () => { T.hidden = true; };
  const g = $("#treeSvg"); V.tree = {};
  TREE.filter(t => t.p).forEach(t => { const p = TREE.find(x => x.k === t.p);
    V.tree[`${t.k}:edge`] = svg("line", {x1: p.x, y1: p.y + 34, x2: t.x, y2: t.y - 34, stroke: "#1d3b36", "stroke-width": 3}, g); });
  TREE.forEach(t => {
    const box = svg("rect", {x: t.x - 108, y: t.y - 34, width: 216, height: 68, rx: 14, fill: "#0b1a1d", stroke: "#1d3b36", "stroke-width": 2.5}, g);
    const name = text(t.x, t.y - 6, t.n, {"font-size": 21, "font-family": "Sora", "font-weight": 700, "text-anchor": "middle"}, g);
    text(t.x, t.y + 18, t.m, {"font-size": 14, fill: "#8aa7a0", "text-anchor": "middle", "font-family": "JetBrains Mono"}, g);
    const tool = text(t.x, t.y + 56, "", {"font-size": 14, fill: "#2ee6be", "text-anchor": "middle", "font-family": "JetBrains Mono"}, g);
    V.tree[t.k] = {t, box, name, tool, n: 0};
  });
}
const POLICY_NOTE = {claude: "running on Claude: Opus 5.5 leads, Sonnet 5.5 workers", scripted: "offline policy (no API key): the same agents, tools and graders"};
function treeEvent(e) {
  if (e.type === "run_start" && $("#treeFoot")) $("#treeFoot").textContent = POLICY_NOTE[e.policy] || e.policy;  // the policy the run really used
  const node = V.tree && V.tree[e.agent];
  if (!node) return;
  if (e.type === "agent_start") {
    node.n++;
    node.box.setAttribute("stroke", "#2ee6be"); node.box.setAttribute("fill", "#0f2b27");
    if (node.n > 1) node.name.textContent = `${node.t.n} ×${node.n}`;
    const edge = V.tree[`${e.agent}:edge`];
    if (edge) edge.setAttribute("stroke", "#2ee6be");
  }
  if (e.type === "tool") {
    node.tool.textContent = e.tool;
    node.box.animate?.([{fill: "#2ee6be"}, {fill: "#0f2b27"}], {duration: 500});
  }
  if (e.type === "agent_end") node.box.setAttribute("stroke", "#15705e");
}
async function runAgents() {
  const q = ($("#askQ")?.value || "").trim() || $("#askQ")?.placeholder || "";
  $("#runAgents").disabled = true;
  try {
    const r = await api("/api/scenario/mission", {question: q});
    showTree(q, r.policy);
    let seen = 0;
    for (let i = 0; i < 600; i++) {
      await new Promise(res => setTimeout(res, 400));
      const run = await (await fetch(`/api/runs/${r.run_id}`)).json().catch(() => null);
      if (!run || !run.events) continue;
      run.events.slice(seen).forEach(treeEvent);
      seen = run.events.length;
      if (run.grade || run.error) {
        const calls = run.events.filter(e => e.type === "tool").length, agents = run.events.filter(e => e.type === "agent_start").length;
        const msg = run.grade ? `${agents} agents · ${calls} tool calls · brief graded ${run.grade.score.toFixed(2)} by code graders` : `mission failed: ${run.error}`;
        if ($("#treeFoot")) $("#treeFoot").textContent = msg;
        toast(`<b>${esc(msg)}</b>`, 8000);
        break;
      }
    }
  } catch (e) { toast(`<b>${esc(e.message)}</b>`); }
  if ($("#runAgents")) $("#runAgents").disabled = false;
}

// ---------------------------------------------------------------- sign-in
function signedOut() { $("#stage").hidden = true; $("#login").hidden = false; $("#email").focus(); }
async function start() {
  const st = await (await fetch("/api/session")).json();
  if (st.demo_login) { $("#demoHint").hidden = false; $("#demoHint").innerHTML = `Demo account: <span class="mono">${esc(st.demo_login.email)}</span> / <span class="mono">${esc(st.demo_login.password)}</span>`; $("#email").value = st.demo_login.email; }
  if (!st.signed_in) return signedOut();
  await enter(st);
}
async function enter(st) {
  S = await api("/api/scenario", null, "GET");
  $("#login").hidden = true; $("#stage").hidden = false;
  $("#who").textContent = `${st.name}`;
  $("#title").textContent = S.title;
  $("#beats").innerHTML = BEATS.map((b, i) => `<button data-i="${i}">${b.name}</button>`).join("");
  $("#beats").querySelectorAll("button").forEach(b => b.onclick = () => showBeat(+b.dataset.i));
  showBeat(0);
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginErr").textContent = "";
  try { const st = await api("/api/session", {email: $("#email").value, password: $("#password").value}); await enter(st); }
  catch (err) { $("#loginErr").textContent = err.message === "signed out" ? "Wrong email or password." : err.message; }
};
$("#signOut").onclick = async () => { await fetch("/api/session", {method: "DELETE"}); signedOut(); };
$("#explainBtn").onclick = explain;
$("#exClose").onclick = () => $("#explain").close();
$("#bigBtn").onclick = () => document.body.classList.toggle("big");
$("#summaryBtn").onclick = summary;
$("#resetBtn").onclick = async () => { S = await api("/api/scenario/reset"); showBeat(0); toast("<b>Scenario reset</b> to the seed"); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#summary").hidden) { $("#summary").hidden = true; return; }
  if (e.key === "Escape" && !$("#agentTree").hidden) { $("#agentTree").hidden = true; return; }
  if (FILM || $("#stage").hidden || !$("#summary").hidden || e.target.closest("input, select, textarea") || $("#explain").open) return;
  if (e.key === "ArrowRight") showBeat(Math.min(BEATS.length - 1, beat + 1));
  if (e.key === "ArrowLeft") showBeat(Math.max(0, beat - 1));
  if (e.key.toLowerCase() === "l") document.body.classList.toggle("big");
  if (e.key.toLowerCase() === "r") $("#resetBtn").click();
  if (e.key.toLowerCase() === "p") summary();
  if (e.key === "Escape") $("#summary").hidden = true;
});

// ---------------------------------------------------------------- the hard 30-second film (?film): a pure function of time
const SHOTS = [  // [start s, end s, kind]
  [0, 2.8, "hook"], [2.8, 8.6, "site"], [8.6, 16.6, "clock"], [16.6, 22.6, "families"], [22.6, 26.4, "funding"], [26.4, 30, "end"]];
const FILM_TEXT = {
  hook: ["Habitat OC turns land into homes in about four years.", "Families can't wait that long."],
  site: ["A church offers its parking lot.", "AI finds room for 30 homes, then screens SB 4."],
  clock: ["Same project. Offer to move-in in 2.4 years, not 4.2.", "SB 4 by right · funding and families start on day one"],
  families: ["30 families banks turn away.", "Mortgages priced on staying 10 years, not on closing."],
  funding: ["And who closes the gap.", "Every home underwritten on its own family's loan."],
};
let shot = -1;
function filmFrame(t) {
  const i = SHOTS.findIndex(s => t >= s[0] && t < s[1]), k = i < 0 ? SHOTS.length - 1 : i;
  const [a, b, kind] = SHOTS[k], p = clamp((t - a) / (b - a));
  if (k !== shot) {
    shot = k; $("#viz").innerHTML = "";
    if (kind === "hook" || kind === "end") buildCard(kind); else { BUILD[kind](); }
    const head = {site: "site", clock: "clock", families: "mortgages", funding: "capital"}[kind];
    $("#hv").textContent = head ? S.headlines[head].value : "";
    $("#label").textContent = head ? FILM_TEXT[kind][0] : "";
    $("#why").textContent = head ? FILM_TEXT[kind][1] : "";
    $("footer").style.visibility = head ? "visible" : "hidden";
  }
  if (kind === "hook" || kind === "end") updateCard(kind, p); else UPDATE[kind](Math.min(1, p * 1.25));
  if (kind === "clock") {
    filmToasts(p);  // the headline counts down with the bars (same easing as updateClock)
    const e = seg(Math.min(1, p * 1.25), .18, .62);
    $("#hv").textContent = `${lerp(S.timeline.baseline.years, S.timeline.keystone.years, e).toFixed(1)} years`;
  }
}
function buildCard(kind) {
  if (kind === "hook") {
    V.c1 = text(800, 320, FILM_TEXT.hook[0], {"font-size": 54, "font-family": "Sora", "font-weight": 800, "text-anchor": "middle"});
    V.c2 = text(800, 420, FILM_TEXT.hook[1], {"font-size": 54, "font-family": "Sora", "font-weight": 800, "text-anchor": "middle", fill: "#2ee6be"});
  } else {
    V.c1 = text(800, 230, "EUODOS", {"font-size": 110, "font-family": "Sora", "font-weight": 800, "text-anchor": "middle", "letter-spacing": 26});
    text(800, 110, "IMPACT LAB · LANE 2 · CLEAR IT", {"font-size": 22, "text-anchor": "middle", fill: "#2ee6be", "font-family": "JetBrains Mono", "letter-spacing": 6});
    V.c2 = text(800, 340, `Offer to move-in in ${S.timeline.keystone.years} years, not ${S.timeline.baseline.years}.`, {"font-size": 44, "font-family": "Sora", "font-weight": 700, "text-anchor": "middle", fill: "#2ee6be"});
    V.c3 = text(800, 420, "Real OC parcels · real HMDA loans · every number cites its source", {"font-size": 26, "text-anchor": "middle", fill: "#b4c9c3"});
    V.c4 = text(800, 500, "Built for Habitat for Humanity of Orange County · Keys to 100", {"font-size": 24, "text-anchor": "middle", fill: "#b4c9c3"});
    V.c5 = text(800, 600, "Mac app: github.com/MaranZeal678/euodos-releases", {"font-size": 24, "text-anchor": "middle", fill: "#8aa7a0", "font-family": "JetBrains Mono"});
  }
}
function updateCard(kind, p) {
  if (kind === "hook") { V.c1.setAttribute("opacity", seg(p, 0, .25)); V.c2.setAttribute("opacity", seg(p, .4, .65)); }
  else [V.c1, V.c2, V.c3, V.c4, V.c5].forEach((c, i) => c.setAttribute("opacity", seg(p, i * .1, .2 + i * .1)));
}
let toastsShown = 0;
function filmToasts(p) {
  const tools = (TRACE?.events || []).filter(e => e.type === "tool").slice(0, 7);
  const due = Math.floor(seg(p, .1, .9) * tools.length);
  while (toastsShown < due) { const e = tools[toastsShown++]; toast(`${esc(e.agent)} → <b>${esc(e.tool)}</b> <i>MCP</i>`, 2400); }
}
async function filmInit() {
  document.body.classList.add("film");
  [S, TRACE] = await Promise.all([fetch("/static/demo/scenario_seed.json").then(r => r.json()), fetch("/api/demo/trace").then(r => r.json()).catch(() => null)]);
  $("#login").hidden = true; $("#stage").hidden = false;
  $("#title").textContent = "Habitat for Humanity of Orange County · Keys to 100";
  await document.fonts.ready;
  window.startFilm = () => { const t0 = performance.now(); const loop = () => { const t = (performance.now() - t0) / 1000; filmFrame(Math.min(t, 29.999)); if (t < 30) requestAnimationFrame(loop); }; requestAnimationFrame(loop); };
  window.FILM_READY = true;
  if (new URLSearchParams(location.search).has("play")) window.startFilm();
}

if (FILM) filmInit(); else start();
</script>
